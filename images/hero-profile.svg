<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" fill="none" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing=".08em">
  <!-- Sewer long section: ground, pipe, manholes, existing vs proposed hydraulic grade line -->
  <defs>
    <pattern id="soil" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#FFFFFF" stroke-opacity=".07" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- soil body -->
  <polygon points="0,72 180,64 330,78 470,70 570,60 700,74 810,80 950,68 1050,74 1200,66 1200,300 0,300" fill="url(#soil)"/>
  <!-- ground surface -->
  <polyline points="0,72 180,64 330,78 470,70 570,60 700,74 810,80 950,68 1050,74 1200,66" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="2"/>

  <!-- pipe -->
  <polygon points="0,190 1200,240 1200,256 0,206" fill="#0A2F52"/>
  <line x1="0" y1="190" x2="1200" y2="240" stroke="#FFFFFF" stroke-opacity=".85" stroke-width="2"/>
  <line x1="0" y1="206" x2="1200" y2="256" stroke="#FFFFFF" stroke-opacity=".85" stroke-width="2"/>

  <!-- manholes -->
  <g fill="#0A2F52" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1.5">
    <rect x="82" y="68" width="16" height="126"/>
    <rect x="322" y="78" width="16" height="126"/>
    <rect x="562" y="60" width="16" height="154"/>
    <rect x="802" y="80" width="16" height="144"/>
    <rect x="1042" y="74" width="16" height="160"/>
  </g>
  <g fill="#FFFFFF" fill-opacity=".6">
    <text x="90" y="54" text-anchor="middle">MH-01</text>
    <text x="330" y="64" text-anchor="middle">MH-02</text>
    <text x="810" y="66" text-anchor="middle">MH-04</text>
    <text x="1050" y="60" text-anchor="middle">MH-05</text>
  </g>

  <!-- relief storage option -->
  <line x1="570" y1="214" x2="570" y2="246" stroke="#84CC16" stroke-width="2"/>
  <rect x="500" y="246" width="140" height="34" stroke="#84CC16" stroke-width="2" stroke-dasharray="6 4" fill="#84CC16" fill-opacity=".08"/>
  <text x="570" y="267" text-anchor="middle" fill="#84CC16">OPTION B</text>

  <!-- existing HGL -->
  <polyline points="0,186 330,150 570,42 700,118 810,190 1200,236" stroke="#00A6A6" stroke-width="2.5" stroke-dasharray="9 6"/>
  <circle cx="570" cy="42" r="5" fill="#00A6A6"/>
  <text x="586" y="30" fill="#00A6A6">FLOOD RISK</text>

  <!-- proposed HGL -->
  <polyline points="0,184 330,174 570,168 810,200 1050,226 1200,236" stroke="#84CC16" stroke-width="3"/>

  <!-- pipe label -->
  <text x="930" y="218" fill="#FFFFFF" fill-opacity=".55" transform="rotate(2.4 930 218)">Ø 1200</text>

  <!-- legend -->
  <g transform="translate(860 18)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#00A6A6" stroke-width="2.5" stroke-dasharray="9 6"/>
    <text x="44" y="4" fill="#FFFFFF" fill-opacity=".7">EXISTING HGL</text>
    <line x1="170" y1="0" x2="204" y2="0" stroke="#84CC16" stroke-width="3"/>
    <text x="214" y="4" fill="#FFFFFF" fill-opacity=".7">PROPOSED</text>
  </g>

  <!-- chainage -->
  <line x1="0" y1="294" x2="1200" y2="294" stroke="#FFFFFF" stroke-opacity=".25"/>
  <g stroke="#FFFFFF" stroke-opacity=".35">
    <line x1="90" y1="288" x2="90" y2="294"/><line x1="330" y1="288" x2="330" y2="294"/><line x1="570" y1="288" x2="570" y2="294"/><line x1="810" y1="288" x2="810" y2="294"/><line x1="1050" y1="288" x2="1050" y2="294"/>
  </g>
</svg>
