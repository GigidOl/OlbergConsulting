<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing=".08em">
  <!-- Interconnected sewer network: relieving one constraint shifts pressure downstream -->
  <!-- catchments -->
  <rect x="120" y="22" width="130" height="120" rx="14" fill="#00A6A6" fill-opacity=".08"/>
  <rect x="320" y="22" width="130" height="120" rx="14" fill="#00A6A6" fill-opacity=".08"/>
  <rect x="220" y="236" width="130" height="90" rx="14" fill="#00A6A6" fill-opacity=".08"/>
  <text x="134" y="42" fill="#4A5B6C">CATCHMENT A</text>
  <text x="334" y="42" fill="#4A5B6C">CATCHMENT B</text>
  <text x="234" y="318" fill="#4A5B6C">CATCHMENT C</text>

  <!-- branches -->
  <g stroke="#0F4C81" stroke-width="3" stroke-linecap="round">
    <line x1="180" y1="80" x2="180" y2="190"/>
    <line x1="380" y1="80" x2="380" y2="190"/>
    <line x1="280" y1="190" x2="280" y2="276"/>
    <line x1="140" y1="104" x2="180" y2="104"/>
    <line x1="420" y1="110" x2="380" y2="110"/>
    <!-- trunk -->
    <line x1="40" y1="190" x2="540" y2="190" stroke-width="6"/>
  </g>

  <!-- outlet arrow -->
  <path d="M540 180 L566 190 L540 200 Z" fill="#0F4C81"/>
  <text x="500" y="224" fill="#4A5B6C">OUTLET</text>

  <!-- minor nodes -->
  <g fill="#FFFFFF" stroke="#0F4C81" stroke-width="2.5">
    <circle cx="180" cy="80" r="6"/><circle cx="380" cy="80" r="6"/><circle cx="280" cy="276" r="6"/>
    <circle cx="140" cy="104" r="5"/><circle cx="420" cy="110" r="5"/>
    <circle cx="80" cy="190" r="9"/><circle cx="180" cy="190" r="9"/><circle cx="480" cy="190" r="9"/>
  </g>

  <!-- relieved constraint -->
  <circle cx="280" cy="190" r="20" stroke="#84CC16" stroke-width="3" fill="#84CC16" fill-opacity=".12"/>
  <circle cx="280" cy="190" r="9" fill="#FFFFFF" stroke="#0F4C81" stroke-width="2.5"/>
  <text x="196" y="236" fill="#4D7C0F">UPGRADE</text>

  <!-- shifted pressure -->
  <circle cx="380" cy="190" r="24" stroke="#00A6A6" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="380" cy="190" r="15" stroke="#00A6A6" stroke-width="3" fill="#00A6A6" fill-opacity=".12"/>
  <circle cx="380" cy="190" r="9" fill="#FFFFFF" stroke="#0F4C81" stroke-width="2.5"/>
  <path d="M292 168 C 310 140, 350 140, 368 166" stroke="#00A6A6" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M362 158 L370 170 L356 168" stroke="#00A6A6" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <text x="396" y="236" fill="#007A7A">PRESSURE</text>
  <text x="396" y="250" fill="#007A7A">SHIFTS</text>
</svg>
