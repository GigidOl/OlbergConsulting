<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" role="img" aria-labelledby="t">
  <title id="t">Olberg Consulting</title>
  <!-- Stand-alone mark: pipe cross-section running part-full, with the lime water-level ▽.
       For light backgrounds. Light version: olberg-mark-light.svg. Favicon: favicon.svg -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A345A"/>
      <stop offset="1" stop-color="#0B7E8E"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00A6A6"/>
      <stop offset="1" stop-color="#0B6E9E"/>
    </linearGradient>
  </defs>
  <circle cx="44" cy="44" r="40" fill="none" stroke="url(#ring)" stroke-width="7"/>
  <path d="M8.4 52H79.6A36.5 36.5 0 0 1 8.4 52Z" fill="url(#water)"/>
  <line x1="8.4" y1="52" x2="79.6" y2="52" stroke="#84CC16" stroke-width="1.6"/>
  <polygon points="38.5,41 49.5,41 44,49.5" fill="#84CC16"/>
</svg>
